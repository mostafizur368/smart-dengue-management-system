<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Schedule Management</title><style>body{font-family:Arial,sans-serif;background:#f4f8fb;color:#163042;padding:24px}.wrap{max-width:800px;margin:auto}.card{background:white;padding:22px;border-radius:14px;box-shadow:0 3px 12px #0001}input,select,button{padding:10px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#087f8c;color:white;border:0;border-radius:8px;cursor:pointer}a{color:#087f8c}</style></head><body><main class="wrap"><p><a href="../admin-dashboard.html">← Back to Admin Dashboard</a></p><div class="card"><h1>🗓️ Doctor Schedule Management</h1><p>Set a doctor's available days and time window. This saves schedule fields to the matching public_doctors document.</p><form id="form"><label>Doctor document ID</label><input id="id" required placeholder="Firestore public_doctors document ID"><label>Available days</label><input id="days" required placeholder="Mon, Tue, Wed"><label>Start time</label><input id="start" type="time" required><label>End time</label><input id="end" type="time" required><label>Daily ticket limit</label><input id="limit" type="number" min="1" max="30" value="30" required><button>Save Schedule</button></form><p id="msg"></p></div></main><script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const config={apiKey:'AIzaSyAnup3vd_NNkSKrhHtuZdQDJ0kuBZAci9o',authDomain:'smart-dengue-management-system.firebaseapp.com',projectId:'smart-dengue-management-system',storageBucket:'smart-dengue-management-system.firebasestorage.app',messagingSenderId:'164368465699',appId:'1:164368465699:web:79fe552bea0b2bfc405696'};const app=getApps().length?getApps()[0]:initializeApp(config),auth=getAuth(app),db=getFirestore(app);let allowed=false;onAuthStateChanged(auth,u=>{allowed=!!u;document.getElementById('msg').textContent=u?'Signed in. Admin permissions are checked by Firestore Rules.':'Please sign in as Admin before saving.'});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');if(!allowed){msg.textContent='Please sign in first.';return}try{await setDoc(doc(db,'public_doctors',document.getElementById('id').value.trim()),{schedule:{days:document.getElementById('days').value.trim(),startTime:document.getElementById('start').value,endTime:document.getElementById('end').value,dailyTicketLimit:Number(document.getElementById('limit').value)},scheduleUpdatedAt:serverTimestamp()},{merge:true});msg.textContent='Schedule saved.'}catch(err){console.error(err);msg.textContent='Could not save. Confirm Admin login and public_doctors write rules.'}})</script></body></html>
