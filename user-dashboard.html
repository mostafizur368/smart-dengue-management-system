
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Smart Dengue Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f7f5;
            color: #333;
        }

        .dashboard {
            max-width: 1000px;
            margin: 30px auto;
        }

        h1 {
            color: #00897b;
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 11px 16px;
            background: #00897b;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .appointment-card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            overflow-wrap: anywhere;
        }

        .appointment-card p {
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #765800;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin: 25px 0;
        }
    </style>
</head>

<body>
    <main class="dashboard">
        <div class="top-bar">
            <a class="btn" href="index.html">← Home</a>
            <button class="btn" id="logout-btn">Logout</button>
        </div>

        <h1>📋 My Appointment Dashboard</h1>
        <p id="welcome" style="text-align:center;"></p>

        <div id="message">Checking login and loading appointments...</div>
        <div id="appointments-list"></div>
    </main>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnup3vd_NNkSKrhHtuZdQDJ0kuBZAci9o",
            authDomain: "smart-dengue-management-system.firebaseapp.com",
            projectId: "smart-dengue-management-system",
            storageBucket: "smart-dengue-management-system.firebasestorage.app",
            messagingSenderId: "164368465699",
            appId: "1:164368465699:web:79fe552bea0b2bfc405696",
            measurementId: "G-384ZPGT9NN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const message = document.getElementById("message");
        const appointmentsList = document.getElementById("appointments-list");

        onAuthStateChanged(auth, async function(user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("welcome").textContent =
                "Welcome, " + (user.displayName || user.email);
                console.log("Logged-in UID:", user.uid);

            message.textContent = "Loading your appointments...";

            try {
                const appointmentsQuery = query(
                    collection(db, "appointments"),
                    where("userId", "==", user.uid)
                );

                const snapshot = await getDocs(appointmentsQuery);

                appointmentsList.replaceChildren();

                if (snapshot.empty) {
                    message.textContent =
                        "No appointments found for this account.";
                    return;
                }

                snapshot.forEach(function(docSnapshot) {
                    const appointment = docSnapshot.data();

                    const card = document.createElement("article");
                    card.className = "appointment-card";

                    const title = document.createElement("h2");
                    title.textContent = "🎫 Appointment Ticket";
                    card.appendChild(title);

                    const fields = [
                        ["Ticket ID", docSnapshot.id],
                        ["Patient", appointment.patientName],
                        ["Phone", appointment.patientPhone],
                        ["Doctor", appointment.doctorName],
                        ["Date", appointment.appointmentDate],
                        ["Time", appointment.appointmentTime],
                        ["Status", appointment.status || "Pending"]
                    ];

                    fields.forEach(function(field) {
                        const paragraph = document.createElement("p");
                        const label = document.createElement("strong");

                        label.textContent = field[0] + ": ";
                        paragraph.appendChild(label);
                        paragraph.appendChild(
                            document.createTextNode(
                                field[1] == null ? "Not available" : String(field[1])
                            )
                        );

                        card.appendChild(paragraph);
                    });

                    appointmentsList.appendChild(card);
                });

                message.textContent = "Your appointments are shown below.";

            } catch (error) {
                console.error("Dashboard error:", error);
                message.textContent =
                    "Could not load appointments. Please check Firestore permissions and try again.";
            }
        });

        document.getElementById("logout-btn").addEventListener("click", async function() {
            try {
                await signOut(auth);
                window.location.href = "login.html";
            } catch (error) {
                alert("Logout failed: " + error.message);
            }
        });
    </script>
</body>
</html>
