
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Smart Dengue Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f7f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #00897b;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #00897b;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #00695c;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #00897b;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>🦟 User Login</h1>
        <p class="subtitle">Smart Dengue Management System</p>

        <form id="login-form">
            <label for="login-email">Email Address</label>
            <input
                type="email"
                id="login-email"
                required
                autocomplete="email"
                placeholder="Enter your email"
            >

            <label for="login-password">Password</label>
            <input
                type="password"
                id="login-password"
                required
                autocomplete="current-password"
                placeholder="Enter your password"
            >

            <button type="submit">Login</button>
            <p id="message" role="status"></p>
        </form>

        <p class="link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <p class="link">
            <a href="index.html">← Back to Home</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnup3vd_NNkSKrhHtuZdQDJ0kuBZAci9o",
            authDomain: "smart-dengue-management-system.firebaseapp.com",
            projectId: "smart-dengue-management-system",
            storageBucket: "smart-dengue-management-system.firebasestorage.app",
            messagingSenderId: "164368465699",
            appId: "1:164368465699:web:79fe552bea0b2bfc405696",
            measurementId: "G-384ZPGT9NN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
const db = getFirestore(app);
        const loginForm = document.getElementById("login-form");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            message.textContent = "Logging in...";
            message.style.color = "#00897b";

  
try {
    const credential = await signInWithEmailAndPassword(auth, email, password);
    const user = credential.user;

    message.textContent = "Login successful! Redirecting...";
    message.style.color = "green";

    const userSnap = await getDoc(doc(db, "users", user.uid));
    const role = userSnap.exists()
        ? userSnap.data().role.toLowerCase()
        : "user";

    setTimeout(function() {
        const returnTo = new URLSearchParams(window.location.search).get("return");

        
if (role === "admin") {
    window.location.href = "assets/admin/admin-dashboard.html";
} else if (role === "doctor") {
    window.location.href = "assets/doctor/doctor-dashboard.html";
} else if (returnTo === "appointment") {
    window.location.href = "index.html#doctor-list";
} else {
    window.location.href = "index.html";
}

    }, 1000);

         


            } catch (error) {
                console.error("Login error:", error);

                if (
                    error.code === "auth/invalid-credential" ||
                    error.code === "auth/user-not-found" ||
                    error.code === "auth/wrong-password"
                ) {
                    message.textContent = "Email or password is incorrect.";
                } else if (error.code === "auth/invalid-email") {
                    message.textContent = "Please enter a valid email address.";
                } else {
                    message.textContent = "Login failed: " + error.message;
                }

                message.style.color = "red";
            }
        });
    </script>
</body>
</html>
